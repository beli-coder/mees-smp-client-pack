name: Build Mees SMP Client Pack
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # needed for tag-triggered GitHub Releases
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test pack build and dependency resolution
        run: python -m unittest discover -s tests -v
      # On main, refresh only when the manifest changed. The bot commits
      # the resulting lockfile; tagged releases always use pinned dependencies.
      - name: Refresh lockfile when manifest changed
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          mp, lp = Path("manifest.json"), Path("pack.lock.json")
          manifest = json.loads(mp.read_text())
          try:
              lock = json.loads(lp.read_text())
              stale = (lock.get("manifest_sha256") != hashlib.sha256(mp.read_bytes()).hexdigest()
                       or any(lock.get(k) != manifest.get(k) for k in
                              ("version", "minecraft", "fabric_loader", "name")))
          except (FileNotFoundError, ValueError):
              stale = True
          if stale:
              print("Manifest and lock differ; resolving pinned client mods", flush=True)
              subprocess.run([sys.executable, "scripts/modpack.py", "lock"], check=True)
          else:
              print("Lockfile matches manifest; no re-resolution needed.")
          PY
      - name: Commit refreshed lockfile on main
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- pack.lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pack.lock.json
            git commit -m 'chore: pin updated client dependencies [skip ci]'
            git push origin HEAD:main
          fi
      - name: Check release tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          assert os.environ['GIT_REF'] == 'v' + version, 'Git tag must match manifest version'
          PY
      - name: Build from committed lockfile (no network resolution)
        run: python scripts/modpack.py build
      - name: Upload installable Modrinth pack
        uses: actions/upload-artifact@v6
        with:
          name: mees-smp-client
          path: dist/*.mrpack
          if-no-files-found: error
      - name: Publish tagged pack to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --generate-notes --title "Mees SMP Client $GITHUB_REF_NAME"
