name: Build Mees SMP Client Pack
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_modrinth:
        description: 'Publish the tested pack to Modrinth (requires MODRINTH_TOKEN)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write  # needed for tag-triggered GitHub Releases
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test pack build and dependency resolution
        run: python -m unittest discover -s tests -v
      # On main, refresh only when the manifest changed. The bot commits
      # the resulting lockfile; tagged releases always use pinned dependencies.
      - name: Refresh lockfile when manifest changed
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          mp, lp = Path("manifest.json"), Path("pack.lock.json")
          manifest = json.loads(mp.read_text())
          try:
              lock = json.loads(lp.read_text())
              stale = (lock.get("manifest_sha256") != hashlib.sha256(mp.read_bytes()).hexdigest()
                       or any(lock.get(k) != manifest.get(k) for k in
                              ("version", "minecraft", "fabric_loader", "name")))
          except (FileNotFoundError, ValueError):
              stale = True
          if stale:
              print("Manifest and lock differ; resolving pinned client mods", flush=True)
              subprocess.run([sys.executable, "scripts/modpack.py", "lock"], check=True)
          else:
              print("Lockfile matches manifest; no re-resolution needed.")
          PY
      - name: Commit refreshed lockfile on main
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- pack.lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pack.lock.json
            git commit -m 'chore: pin updated client dependencies [skip ci]'
            git push origin HEAD:main
          fi
      - name: Check release tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          assert os.environ['GIT_REF'] == 'v' + version, 'Git tag must match manifest version'
          PY
      - name: Build from committed lockfile (no network resolution)
        run: python scripts/modpack.py build
      - name: Upload installable Modrinth pack
        uses: actions/upload-artifact@v6
        with:
          name: mees-smp-client
          path: dist/*.mrpack
          if-no-files-found: error
      # Existing v0.2.2 tag was already created before Modrinth integration.
      # Run workflow_dispatch on main with publish_modrinth=true for first upload.
      # Future new v* tags publish automatically from the pinned lockfile.
      - name: Publish tested pack to Modrinth
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_modrinth)
        env:
          MODRINTH_TOKEN: ${{ secrets.API_TOKEN_MODRINTH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN:-}" ]]; then
            echo "::error::Missing API_TOKEN_MODRINTH GitHub secret. Add a Modrinth PAT with VERSION_CREATE permission in repository Actions secrets."
            exit 1
          fi
          API='https://api.modrinth.com/v2'
          AGENT='beli-coder/mees-smp-client-pack/1.0 (https://github.com/beli-coder/mees-smp-client-pack)'
          v=$(jq -er '.version' manifest.json)
          mc=$(jq -er '.minecraft' manifest.json)
          pack="dist/Mees-SMP-Client-${v}.mrpack"
          test -s "$pack"
          digest=$(sha512sum "$pack" | cut -d' ' -f1)
          project=$(curl --fail-with-body -fsS -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $AGENT" "$API/project/mees-modpack")
          project_id=$(jq -er 'select(.project_type == "modpack") | .id' <<< "$project")
          versions=$(curl --fail-with-body -fsS -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $AGENT" "$API/project/$project_id/version")
          if jq -e --arg v "$v" '[.[] | select(.version_number == $v)] | length > 0' >/dev/null <<< "$versions"; then
            if jq -e --arg v "$v" --arg digest "$digest" '[.[] | select(.version_number == $v) | .files[]? | select(.hashes.sha512 == $digest)] | length > 0' >/dev/null <<< "$versions"; then
              echo "Modrinth version $v already contains this exact pack; no duplicate created."
              exit 0
            fi
            echo "::error::Modrinth version $v already exists with different file hashes; bump the manifest version to release an update."
            exit 1
          fi
          payload=$(jq -cn --arg pid "$project_id" --arg v "$v" --arg mc "$mc" '{
            project_id: $pid,
            name: ("Mees SMP Client " + $v),
            version_number: $v,
            changelog: ("Official Mees SMP deluxe client modpack " + $v + ". Includes performance, shaders, Distant Horizons, mapping, voice chat, inventory QoL, and building tools."),
            dependencies: [],
            game_versions: [$mc],
            version_type: "release",
            loaders: ["fabric"],
            file_parts: ["file"],
            primary_file: "file"
          }')
          response=$(curl --fail-with-body -fsS -X POST \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $AGENT" \
            -F "data=$payload" \
            -F "file=@$pack;type=application/octet-stream" \
            "$API/version")
          jq -er '"Published Modrinth version ID: " + .id' <<< "$response"
      - name: Publish tagged pack to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --generate-notes --title "Mees SMP Client $GITHUB_REF_NAME"
